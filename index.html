<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
--text:#f4f6ff;--muted:rgba(244,246,255,.62);
--line:rgba(255,255,255,.10);--line2:rgba(255,255,255,.18);
--card:rgba(255,255,255,.055);--media:rgba(255,255,255,.06);--input:rgba(255,255,255,.075);
--gold:#f5c56b;--gold2:#ffe9b0;--violet:#8b5cf6;--cyan:#22d3ee;--good:#34d399;--danger:#fb7185;
--grad:linear-gradient(135deg,#f5c56b,#ff8a5c 30%,#8b5cf6 65%,#22d3ee);
--numgrad:linear-gradient(90deg,#ffe9b0,#22d3ee);
--ringbg:#0b1024;
--shadow:0 24px 80px rgba(0,0,0,.45);
}
:root[data-theme="light"]{
--text:#131730;--muted:rgba(19,23,48,.62);
--line:rgba(19,23,48,.12);--line2:rgba(19,23,48,.22);
--card:rgba(255,255,255,.72);--media:rgba(19,23,48,.05);--input:rgba(19,23,48,.05);
--numgrad:linear-gradient(90deg,#7c3aed,#0e7490);
--ringbg:#fff;
--shadow:0 20px 60px rgba(19,23,48,.12);
}
*{box-sizing:border-box}
body{margin:0;font-family:Manrope,Arial,sans-serif;color:var(--text);background:linear-gradient(160deg,#05070f,#0b1024 55%,#0a0f1e);min-height:100vh;overflow-x:hidden}
:root[data-theme="light"] body{background:linear-gradient(160deg,#f7f8ff,#eef2fb 60%,#f3f0ff)}
body::before,body::after{content:"";position:fixed;z-index:-1;border-radius:50%;filter:blur(90px);opacity:.45;pointer-events:none;animation:aurora 20s ease-in-out infinite alternate}
body::before{width:65vmax;height:65vmax;left:-25vmax;top:-25vmax;background:radial-gradient(circle,#6d28d9,transparent 62%)}
body::after{width:55vmax;height:55vmax;right:-20vmax;bottom:-20vmax;background:radial-gradient(circle,#0e7490,transparent 62%);animation-delay:-10s}
:root[data-theme="light"] body::before{background:radial-gradient(circle,rgba(139,92,246,.30),transparent 62%)}
:root[data-theme="light"] body::after{background:radial-gradient(circle,rgba(34,211,238,.25),transparent 62%)}
@keyframes aurora{from{transform:translate(0,0) scale(1)}to{transform:translate(5vmax,3vmax) scale(1.12)}}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:linear-gradient(#8b5cf6,#22d3ee);border-radius:99px}
::-webkit-scrollbar-track{background:transparent}
button,input,textarea,select{font:inherit}
#app{padding:18px 16px 48px}
.shell{max-width:1040px;margin:0 auto;display:grid;gap:16px}
.panel{position:relative;background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.035));border:1px solid var(--line);border-radius:28px;backdrop-filter:blur(22px);box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.08);padding:18px}
:root[data-theme="light"] .panel{background:linear-gradient(180deg,rgba(255,255,255,.85),rgba(255,255,255,.65))}
.hero{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:22px;background:linear-gradient(135deg,rgba(139,92,246,.22),rgba(34,211,238,.10)),linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.035))}
.hero-left{display:flex;align-items:center;gap:16px;min-width:0}
.hero-right{display:flex;gap:8px}
.ring{width:88px;height:88px;border-radius:50%;padding:4px;background:conic-gradient(var(--gold) calc(var(--p)*1%),rgba(255,255,255,.14) 0);flex:0 0 auto;box-shadow:0 0 26px rgba(245,197,107,.28)}
.ring .avatar{width:100%;height:100%;border-radius:50%}
.avatar{width:74px;height:74px;border-radius:50%;overflow:hidden;display:grid;place-items:center;font-size:34px;background:var(--ringbg)}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.name{font-family:Unbounded,Manrope,sans-serif;margin:0;font-size:26px;font-weight:700;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;overflow-wrap:break-word}
.badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.badge{padding:7px 11px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid var(--line);font-weight:700;font-size:12px;color:var(--text);backdrop-filter:blur(8px)}
.badge.gold{background:linear-gradient(90deg,rgba(245,197,107,.22),rgba(34,211,238,.14));border-color:rgba(245,197,107,.42);color:var(--gold2)}
:root[data-theme="light"] .badge{background:rgba(255,255,255,.7)}
:root[data-theme="light"] .badge.gold{color:#8a6100}
.icon-btn{width:50px;height:50px;border-radius:17px;border:1px solid var(--line);background:rgba(255,255,255,.08);color:var(--text);font-size:22px;cursor:pointer;transition:.18s}
.icon-btn:hover{transform:translateY(-2px);border-color:var(--line2)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px;text-align:center;transition:.2s}
.stat:hover{transform:translateY(-3px);border-color:var(--line2)}
.stat b{display:block;font-size:20px;line-height:1.2;background:var(--numgrad);-webkit-background-clip:text;background-clip:text;color:transparent}
.stat span{display:block;margin-top:6px;color:var(--muted);font-size:12px}
.super{display:grid;grid-template-columns:150px 1fr;gap:16px;align-items:center;border-color:rgba(245,197,107,.34);background:linear-gradient(135deg,rgba(245,197,107,.12),rgba(34,211,238,.08)),linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.035));animation:glowPulse 4s ease-in-out infinite}
.super.done{border-color:rgba(52,211,153,.4)}
.super.boss{border-color:rgba(251,113,133,.35);background:linear-gradient(135deg,rgba(251,113,133,.12),rgba(139,92,246,.10)),linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.035))}
@keyframes glowPulse{0%,100%{box-shadow:var(--shadow)}50%{box-shadow:var(--shadow),0 0 44px rgba(245,197,107,.16)}}
.super-media .media{height:112px;border-radius:22px}
.small{color:var(--muted);font-size:13px;line-height:1.45}
.gold{color:var(--gold)}
h1,h2,h3{margin:0}
h2{font-family:Unbounded,Manrope,sans-serif;font-size:19px;margin:0 0 12px;position:relative;padding-bottom:10px}
h2::after{content:"";position:absolute;left:0;bottom:0;width:52px;height:3px;border-radius:99px;background:var(--grad)}
.bar{height:12px;border-radius:999px;overflow:hidden;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.07)}
.bar.big{height:16px}
.fill{position:relative;height:100%;width:0%;background:linear-gradient(90deg,var(--violet),var(--cyan));transition:width .35s ease;overflow:hidden}
.fill.gold{background:linear-gradient(90deg,var(--gold),#ff9f43)}
.fill.good{background:linear-gradient(90deg,var(--good),var(--cyan))}
.fill.bad{background:linear-gradient(90deg,var(--danger),#f97316)}
.fill::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);transform:translateX(-100%);animation:shimmer 2.4s infinite}
@keyframes shimmer{to{transform:translateX(100%)}}
.super-actions{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px}
.tabs{display:flex;gap:8px;padding:8px;overflow:auto;background:rgba(255,255,255,.04);border-radius:22px}
.tab{flex:1;min-width:96px;padding:12px 10px;border-radius:16px;border:1px solid transparent;background:transparent;color:var(--text);font-weight:800;cursor:pointer;transition:.18s}
.tab.active{background:linear-gradient(135deg,var(--violet),var(--cyan));border-color:transparent;color:#fff;box-shadow:0 8px 26px rgba(139,92,246,.38)}
:root[data-theme="light"] .tab{color:#131730}
:root[data-theme="light"] .tab.active{color:#fff}
.content{display:grid;gap:16px}
.form{display:grid;gap:10px}
input,textarea,select{width:100%;min-height:50px;padding:12px 14px;color:var(--text);background:var(--input);border:1px solid var(--line);border-radius:16px;outline:none;transition:.15s}
textarea{min-height:92px;resize:vertical}
input::placeholder,textarea::placeholder{color:rgba(255,255,255,.40)}
:root[data-theme="light"] input::placeholder,:root[data-theme="light"] textarea::placeholder{color:rgba(19,23,48,.40)}
input:focus,textarea:focus,select:focus{border-color:rgba(34,211,238,.65);box-shadow:0 0 0 3px rgba(34,211,238,.12)}
button{position:relative;overflow:hidden;border:0;min-height:50px;padding:12px 16px;border-radius:16px;color:#fff;font-weight:800;cursor:pointer;background:linear-gradient(90deg,var(--violet),var(--cyan));box-shadow:0 12px 26px rgba(139,92,246,.25);transition:.18s}
button:not(:disabled)::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);transform:skewX(-20deg);transition:left .5s}
button:not(:disabled):hover::after{left:120%}
button:hover:not(:disabled){transform:translateY(-2px)}
button:disabled{opacity:.45;cursor:default}
button.danger{background:linear-gradient(90deg,var(--danger),#f97316)}
button.dim{opacity:.55}
button.mini{min-height:42px;padding:8px 12px;border-radius:13px}
.hint{margin-top:10px;color:var(--muted);font-size:13px;line-height:1.45}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:12px;display:grid;gap:10px;transition:.2s}
.card:hover{transform:translateY(-4px);border-color:var(--line2);box-shadow:0 16px 40px rgba(0,0,0,.25)}
.card.done{opacity:.55}
.card.r-rare{border-color:rgba(34,211,238,.35);box-shadow:0 0 24px rgba(34,211,238,.10)}
.card.r-epic{border-color:rgba(139,92,246,.40);box-shadow:0 0 26px rgba(139,92,246,.14)}
.card.r-legendary{border-color:rgba(245,197,107,.45);box-shadow:0 0 30px rgba(245,197,107,.16)}
.card.super-item{border-color:rgba(245,197,107,.45)}
.media{height:88px;border-radius:17px;overflow:hidden;display:grid;place-items:center;background:var(--media);border:1px solid var(--line)}
.media img{width:100%;height:100%;object-fit:cover;display:block}
.ico{font-size:40px}
.pet-float{animation:floaty 3s ease-in-out infinite}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.card-body{display:grid;gap:6px}
.card-actions{display:flex;gap:8px}
.card-actions button:first-child{flex:1}
.price{color:var(--gold);font-weight:800}
.rarity{width:max-content;padding:5px 9px;border-radius:999px;font-size:11px;font-weight:900}
.rarity.common{background:rgba(255,255,255,.10)}
.rarity.rare{background:rgba(34,211,238,.16);color:#a5f3fc;border:1px solid rgba(34,211,238,.25)}
.rarity.epic{background:rgba(139,92,246,.18);color:#ddd6fe;border:1px solid rgba(139,92,246,.28)}
.rarity.legendary{background:rgba(245,197,107,.14);color:#fde68a;border:1px solid rgba(245,197,107,.28)}
.achgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.ach{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px;opacity:.42;filter:grayscale(.55);display:grid;gap:7px}
.ach.un{opacity:1;filter:none;border-color:rgba(34,211,238,.38);background:linear-gradient(135deg,rgba(139,92,246,.16),rgba(34,211,238,.08));box-shadow:0 0 22px rgba(34,211,238,.10)}
.ai{font-size:30px}
.profile{display:grid;gap:14px;justify-items:start}
.avatar-large{width:120px;height:120px;border-radius:34px;overflow:hidden;display:grid;place-items:center;font-size:56px;background:var(--media);border:1px solid var(--line);box-shadow:0 0 34px rgba(139,92,246,.18)}
.avatar-large img{width:100%;height:100%;object-fit:cover;display:block}
.file-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:12px 16px;border-radius:16px;background:rgba(255,255,255,.09);border:1px dashed var(--line2);cursor:pointer;font-weight:800;color:var(--text)}
.profile-stats{grid-template-columns:repeat(2,1fr);width:100%}
.empty{padding:14px;color:var(--muted);border:1px dashed var(--line2);border-radius:16px}
.prev{width:72px;height:72px;object-fit:cover;border-radius:16px;border:1px solid var(--line2);box-shadow:0 8px 24px rgba(0,0,0,.25)}
.prev.big{width:100%;height:140px}
.chart{display:flex;align-items:flex-end;gap:6px;height:170px;padding:12px 0 4px}
.col{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px}
.bar-v{width:100%;min-height:3px;border-radius:8px 8px 0 0;background:linear-gradient(180deg,var(--cyan),var(--violet));box-shadow:0 0 18px rgba(34,211,238,.12)}
.col span{font-size:10px;color:var(--muted)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal-cell{aspect-ratio:1;border-radius:12px;display:grid;place-items:center;font-size:12px;font-weight:700;background:var(--media);border:1px solid var(--line)}
.cal-cell.ok{background:rgba(52,211,153,.25);border-color:rgba(52,211,153,.4)}
.cal-cell.part{background:rgba(245,197,107,.18);border-color:rgba(245,197,107,.35)}
.cal-cell.miss{background:rgba(251,113,133,.18);border-color:rgba(251,113,133,.35)}
.cal-cell.rest{background:rgba(34,211,238,.20);border-color:rgba(34,211,238,.4)}
.cal-cell.future{opacity:.35}
.cal-cell.today{outline:2px solid var(--cyan)}
.cal-cell.blank{background:transparent;border:none}
.notice{padding:12px;border-radius:16px;background:rgba(251,113,133,.08);border:1px solid rgba(251,113,133,.18);color:var(--muted)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#toasts{position:fixed;right:14px;bottom:14px;display:grid;gap:9px;z-index:999;max-width:min(420px,calc(100vw - 28px))}
.toast{padding:14px 16px;border-radius:18px;background:rgba(10,14,28,.92);border:1px solid var(--line2);border-left:4px solid var(--cyan);backdrop-filter:blur(14px);box-shadow:var(--shadow);animation:tIn .3s ease;font-weight:700;line-height:1.35;color:#fff}
:root[data-theme="light"] .toast{background:rgba(255,255,255,.95);color:#131730}
.toast.success{border-left-color:var(--good)}
.toast.error{border-left-color:var(--danger)}
@keyframes tIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media(max-width:760px){.stats{grid-template-columns:repeat(2,1fr)}.super{grid-template-columns:1fr}.tabs{display:grid;grid-template-columns:repeat(2,1fr)}.tab{min-width:0}.row2{grid-template-columns:1fr}.name{font-size:22px}}
</style>
</head>

function today(d=new Date()){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function yest(){const d=new Date();d.setDate(d.getDate()-1);return today(d)}
function addDays(s,n){const[y,m,d]=s.split("-").map(Number);return today(new Date(y,m-1,d+n))}
function nextDate(s){return addDays(s,1)}
function parseDate(s){const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)}
function diffDays(a,b){return Math.round((parseDate(b)-parseDate(a))/86400000)}
function weekMonday(s){const d=parseDate(s);return addDays(s,-((d.getDay()+6)%7))}
function weekIndex(){return Math.floor((parseDate(weekMonday(today()))-parseDate("2024-01-01"))/604800000)}
function currentBoss(){return BOSSES[((weekIndex()%BOSSES.length)+BOSSES.length)%BOSSES.length]}
function hashStr(s){let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))%99991;return h}
function isUrl(s){return /^https?:\/\/|^data:image\//.test(s||"")}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function fmt(n){return Number(n||0).toLocaleString("ru-RU")}
function clamp(n,a=0,b=100){return Math.max(a,Math.min(b,Math.round(n)))}
function rand(a,b){return Math.floor(Math.random()*(b-a+1))+a}
function emojiOf(it,d){if(it.img)return d;if(isUrl(it.i))return d;return it.i||d}
function discRank(d){if(d>=100)return{name:"Платина",icon:"💎"};if(d>=75)return{name:"Золото",icon:"🥇"};if(d>=50)return{name:"Серебро",icon:"🥈"};return{name:"Бронза",icon:"🥉"}}
function val(id){const e=document.getElementById(id);return e?e.value.trim():""}
function petStage(l){return l>=7?"🐉":l>=5?"🐲":l>=4?"🦁":l>=3?"🐺":l>=2?"🐣":"🥚"}
function petLevel(){return 1+Math.floor(S.pet.xp/500)}
function fileToDataURL(file,size,q,cb){const url=URL.createObjectURL(file);const img=new Image();
img.onload=function(){const w=img.width,h=img.height;const k=Math.min(1,size/Math.max(w,h));
const cw=Math.max(1,Math.round(w*k)),ch=Math.max(1,Math.round(h*k));
const c=document.createElement("canvas");c.width=cw;c.height=ch;c.getContext("2d").drawImage(img,0,0,cw,ch);
cb(c.toDataURL("image/jpeg",q));URL.revokeObjectURL(url)};
img.onerror=function(){URL.revokeObjectURL(url);cb(null)};img.src=url}

let S;try{S=normalize(JSON.parse(localStorage.getItem("life-quest-pro-max")||"null"))}catch(e){S=defaults()}

function sleptGood(d){const e=S.sleepLog.find(x=>x.d===d);return !!(e&&e.h>=7&&e.h<=9)}
function sleepStreak(){let n=0;let d=sleptGood(today())?today():yest();while(sleptGood(d)){n++;d=addDays(d,-1)}return n}
function goalMet(d){const h=S.hist.find(x=>x.d===d);return !!(h&&(h.e>=S.goal||h.q>=3))}
function goalMetOrRest(d){return goalMet(d)||S.restDays.includes(d)}
function gapAllRest(from){let d=nextDate(from);const t=today();while(d<t){if(!S.restDays.includes(d))return false;d=nextDate(d)}return true}
function ensureDQ(){const t=today();if(!S.dq||S.dq.date!==t){const h=hashStr(t);const tpl=DQ_POOL[h%DQ_POOL.length];S.dq={date:t,t:tpl.t,i:tpl.i,p:tpl.p,sk:tpl.sk};save()}}
function syncBoss(){const wm=weekMonday(today());
if(S.bossWeek&&S.bossWeek!==wm){const prev=weekRange(S.bossWeek);const prev2=weekRange(addDays(S.bossWeek,-7));
if(prev>0&&prev>prev2){S.duelWins++;S.coins+=1000;S.earned+=1000;toast("⚔️ Дуэль с прошлой неделей выиграна! +1000 монет","success")}}
if(S.bossWeek!==wm){S.bossWeek=wm;S.bossDead=false;save()}}
function syncMega(){const mk=today().slice(0,7);if(S.mbMonth!==mk){S.mbMonth=mk;S.mbDead=false;save()}}
function weekRange(monday){let e=0;const end=addDays(monday,6);for(const h of S.hist)if(h.d>=monday&&h.d<=end)e+=h.e;return e}
function expireBuffs(){const t=today();const b=S.buffs.length;S.buffs=S.buffs.filter(x=>x.exp>=t&&(x.uses===null||x.uses===undefined||x.uses>0));if(S.buffs.length!==b)save()}
function ensureToday(){const t=today();if(S.td!==t){S.td=t;S.ct=[];S.tc=0;S.tp=0}
expireBuffs();syncBoss();syncMega();ensureDQ()}
function buffCoinPct(){const t=today();return S.buffs.filter(b=>b.kind==="coinPct"&&b.exp>=t).reduce((s,b)=>s+(b.value||0),0)}
function addBuff(def){const b={id:"buff"+Date.now()+rand(100,999),key:def.key,name:def.name,icon:def.icon,kind:def.kind,value:def.value||0,uses:def.uses!==undefined?def.uses:null,exp:addDays(today(),def.days),rarity:def.rarity,desc:def.desc};S.buffs.push(b);S.buffsFound++;if(def.rarity==="legendary")S.legendBuffsFound++;if(def.key==="amulet")S.disc=clamp(S.disc+15);save();return b}
function updateHist(a){const t=today();let h=S.hist.find(x=>x.d===t);if(!h){h={d:t,e:0,q:0};S.hist.push(h)}h.e+=a;h.q+=1;if(S.hist.length>400)S.hist=S.hist.slice(-400)}
function applyMissedDays(){if(!S.lastDayChecked)S.lastDayChecked=today();
const yesterday=yest();let d=S.lastDayChecked,applied=0,fineCoins=0,blocked=0,cap=0;
while(d<yesterday&&cap<30){d=nextDate(d);
if(goalMetOrRest(d)){if(S.bank.dep>0){const g=Math.round(S.bank.dep*0.02);S.bank.dep+=g;S.bank.interest+=g}S.pet.mood=clamp(S.pet.mood+2)}
else{S.pet.mood=clamp(S.pet.mood-8);
const shield=S.buffs.find(b=>b.kind==="shield"&&b.uses>0&&b.exp>=d);
if(shield){shield.uses--;S.shielded++;blocked++}
else{S.missed++;S.fines++;S.disc=clamp(S.disc-7);const f=Math.min(S.coins,200);S.coins-=f;S.fineTotal+=f;fineCoins+=f;applied++}}}
cap++}
if(S.lastDayChecked<yesterday)S.lastDayChecked=yesterday;
if(applied||blocked||cap)save();
return{applied,fineCoins,blocked}}
function levelInfo(p){let i=0;for(let x=0;x<LEVEL_THRESHOLDS.length;x++)if(p>=LEVEL_THRESHOLDS[x])i=x;
const cur=LEVEL_THRESHOLDS[i],next=LEVEL_THRESHOLDS[i+1]||0;
return{level:i+1,name:LEVEL_NAMES[i]||"Максимум",cur,next,prog:next?Math.min(100,((p-cur)/(next-cur))*100):100}}
function weekStats(){let e=0,q=0,g=0;const t=today();for(const h of S.hist)if(h.d>=S.bossWeek&&h.d<=t){e+=h.e;q+=h.q;if(goalMet(h.d))g++}return{e,q,g}}
function monthStats(){const mk=today().slice(0,7);let e=0;for(const h of S.hist)if(h.d.slice(0,7)===mk)e+=h.e;return e}
function bossDamage(b){const ws=weekStats();if(b.rule==="coins")return ws.e*b.mult;if(b.rule==="quests")return ws.q*b.mult;if(b.rule==="days")return ws.g*b.mult;return 0}
function checkBoss(n){if(S.bossDead)return;const b=currentBoss();if(bossDamage(b)>=b.hp){S.bossDead=true;S.bossKills++;S.bossTypes[b.key]=(S.bossTypes[b.key]||0)+1;S.coins+=b.reward;S.earned+=b.reward;addInventory("Медаль «"+b.name+"»",b.icon,"boss","epic","Неделя: "+S.bossWeek,"");save();if(n){toast("🐉 Босс побеждён: "+b.name+"! +"+fmt(b.reward),"success");playSound("level")}}}

function tone(f,dur=0.08,type="square",delay=0,vol=0.04){if(!audioCtx)return;const t=audioCtx.currentTime+delay;const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);o.connect(g);g.connect(audioCtx.destination);o.start(t);o.stop(t+dur+0.03)}

function toast(m,type=""){const d=document.createElement("div");d.className="toast "+type;d.textContent=m;toasts.appendChild(d);setTimeout(()=>d.remove(),3800)}
function check(notify=false){const newly=[];let ch=true;while(ch){ch=false;for(const a of ACH)if(!S.u.includes(a.id)&&a.test(S)){S.u.push(a.id);newly.push(a);ch=true}}
if(newly.length)save();
if(notify&&newly.length){newly.slice(0,6).forEach(a=>toast("🏆 Достижение: "+a.name,"success"));if(newly.length>6)toast("И ещё "+(newly.length-6)+" достижений!","success");playSound("achievement")}
return newly}

function lastDays(n){const a=[];for(let i=n-1;i>=0;i--){const d=addDays(today(),-i);const h=S.hist.find(x=>x.d===d);a.push({d,label:d.slice(8)+"."+d.slice(5,7),e:h?h.e:0})}return a}
function calendarHTML(){const now=new Date(),y=now.getFullYear(),m=now.getMonth();const dim=new Date(y,m+1,0).getDate();const t=today();
const mn=now.toLocaleDateString("ru-RU",{month:"long",year:"numeric"});const fd=(new Date(y,m,1).getDay()+6)%7;let c="";
for(let i=0;i<fd;i++)c+=`<div class="cal-cell blank"></div>`;
for(let d=1;d<=dim;d++){const ds=y+"-"+String(m+1).padStart(2,"0")+"-"+String(d).padStart(2,"0");let cls="cal-cell";
if(ds>t||ds<S.created)cls+=" future";
else{if(S.restDays.includes(ds))cls+=" rest";else if(goalMet(ds))cls+=" ok";else if(S.hist.some(h=>h.d===ds))cls+=" part";else if(ds<t)cls+=" miss"}
if(ds===t)cls+=" today";c+=`<div class="${cls}"><span>${d}</span></div>`}
return `<div class="small" style="margin-bottom:10px;text-transform:capitalize">${mn}</div><div class="cal">${c}</div><div class="small" style="margin-top:10px">🟩 цель · 🟨 начат · 🟥 пропуск · 🟦 отдых · контур — сегодня</div>`}

const editPanel=(S.edit&&S.edit.kind==="reward")?editRewardPanel():"";
return `${editPanel}
<div class="panel"><h2>🏦 Банк «Дисциплина»</h2>
<div class="row2"><div class="stat"><b>🪙 ${fmt(S.bank.dep)}</b><span>На вкладе</span></div><div class="stat"><b>💹 ${fmt(S.bank.interest)}</b><span>Заработано процентов</span></div></div>
<div class="small" style="margin:10px 0">+2% в день, но только за дни с выполненной целью дня. Дисциплина приносит деньги.</div>
<div class="form"><input id="bankAmt" type="number" min="1" placeholder="Сумма">

<div class="panel"><h2>Добавить награду</h2><div class="form"><input id="rt" placeholder="Название"><input id="ri" placeholder="Эмодзи или ссылка"><input id="rp" type="number" min="1" value="1000">
<label class="file-btn">📷 Своё фото для награды<input id="rewardPhoto" type="file" accept="image/*" hidden></label>
<img id="rp_prev" class="prev" hidden>
<button data-action="addReward">Добавить награду</button></div>

<div class="panel"><h2>Магазин наград</h2><div class="grid">${rewards}</div></div>`}
function inventoryTab(){const items=S.inv.map(invCard).join("")||`<div class="empty">Инвентарь пуст.</div>`;
return `<div class="panel"><h2>Инвентарь</h2><div class="small">Награды, медали боссов, сезонные трофеи.</div></div><div class="panel"><div class="grid">${items}</div></div>`}
function seasonsTab(){if(S.seasonActive){const p=seasonProgress();if(p)return `<div class="panel super"><div class="super-media"><div class="media"><div class="ico">${p.cfg.icon}</div></div></div><div>
<div class="small gold">Активный сезон</div><h2>${p.cfg.name}</h2><div class="small">${p.cfg.desc}</div>
<div style="margin:10px 0" class="bar big"><div class="fill gold" style="width:${p.percent}%"></div></div>
<div class="small">Дней цели: <b>${p.done}/${p.required}</b> · Осталось: <b>${p.daysLeft}</b> · Награда: <b>${fmt(p.cfg.rewardCoins)}</b></div></div></div>`}
return `<div class="panel"><h2>Сезоны</h2><div class="small">Дополнительные испытания и трофеи.</div></div>
<div class="grid">${["week","month"].map(k=>{const c=SEASONS[k];return `<div class="card"><div class="media"><div class="ico">${c.icon}</div></div>
<div class="card-body"><b>${c.name}</b><div class="small">${c.desc}</div><div class="price">Награда: ${fmt(c.rewardCoins)}</div><div class="small">Завершено: ${S.seasonCompleted[k]}</div></div>
<div class="card-actions"><button data-action="startSeason" data-id="${k}">Начать</button></div></div>`}).join("")}</div>`}
function seasonSuccess(id){if(!S.seasonActive||S.seasonActive!==id||!S.seasonStart||!S.seasonEnd)return false;
let d=S.seasonStart;const t=today();let done=0,el=0;while(d<=S.seasonEnd&&d<=t){el++;if(goalMet(d))done++;d=nextDate(d)}
if(id==="week")return el>=SEASONS.week.days&&done>=SEASONS.week.days;if(id==="month")return done>=25;return false}
function seasonProgress(){if(!S.seasonActive||!S.seasonStart||!S.seasonEnd)return null;const cfg=SEASONS[S.seasonActive];if(!cfg)return null;
let d=S.seasonStart;const t=today();let done=0;while(d<=S.seasonEnd&&d<=t){if(goalMet(d))done++;d=nextDate(d)}
const req=S.seasonActive==="week"?cfg.days:25;return{cfg,done,required:req,percent:Math.min(100,Math.round(done/req*100)),daysLeft:Math.max(0,diffDays(t,S.seasonEnd))}}
function completeSeason(n=true){if(!S.seasonActive)return;const cfg=SEASONS[S.seasonActive];if(!cfg){S.seasonActive=null;save();return}
S.seasonCompleted[cfg.id]++;S.coins+=cfg.rewardCoins;S.earned+=cfg.rewardCoins;addInventory(cfg.item.t,cfg.item.i,"season",cfg.id==="month"?"legendary":"epic","Сезон: "+cfg.name,"");S.seasonActive=null;save();
if(n){toast("🎉 Сезон завершён: "+cfg.name+"! +"+fmt(cfg.rewardCoins),"success");playSound("level")}}
function evaluateSeasons(n=false){if(!S.seasonActive)return;const cfg=SEASONS[S.seasonActive];if(!cfg){S.seasonActive=null;save();return}
const t=today();if(seasonSuccess(S.seasonActive)){if(S.seasonActive==="month"||t>=S.seasonEnd)completeSeason(n);return}
if(t>S.seasonEnd){S.seasonFailed++;S.seasonActive=null;save();if(n){toast("❌ Сезон провален.","error");playSound("error")}}}
function startSeason(id){if(S.seasonActive)return;const cfg=SEASONS[id];if(!cfg)return;S.seasonActive=id;S.seasonStart=today();S.seasonEnd=addDays(today(),cfg.days-1);save();playSound("level");toast("Сезон начался: "+cfg.name,"success");render()}
function achTab(){const un=S.u.length;const pct=Math.round(un/ACH.length*100);const sorted=ACH.slice().sort((a,b)=>(S.u.includes(b.id)?1:0)-(S.u.includes(a.id)?1:0));
return `<div class="panel"><h2>Достижения</h2><div class="small">Открыто: <b>${un}</b> из <b>${ACH.length}</b></div><div style="margin-top:10px" class="bar"><div class="fill gold" style="width:${pct}%"></div></div></div>
<div class="panel"><div class="achgrid">${sorted.map(achCard).join("")}</div></div>`}
function progressTab(){const days=lastDays(14);const max=Math.max(...days.map(x=>x.e),1);const tot=days.reduce((s,x)=>s+x.e,0);const act=days.filter(x=>x.e>0).length;const avg=act?Math.round(tot/act):0;const best=days.reduce((a,b)=>b.e>a.e?b:a,days[0]);
const chart=days.map(x=>`<div class="col" title="${x.label}: ${fmt(x.e)}"><div class="bar-v" style="height:${Math.max(2,Math.round(x.e/max*100))}%"></div><span>${x.label}</span></div>`).join("");
const rank=discRank(S.disc);const dc=S.disc>=70?"good":S.disc>=40?"gold":"bad";
const cur=weekRange(S.bossWeek);const lw=addDays(S.bossWeek,-7);const last=weekRange(lw);const duelMax=Math.max(cur,last,1);
const skills=Object.keys(SKILL_META).map(k=>{const v=S.skills[k];const lv=1+Math.floor(v/1000);
return `<div class="stat"><b>${SKILL_META[k].icon} ур. ${lv}</b><span>${SKILL_META[k].name} · ${fmt(v)}</span></div>`}).join("");
return `<div class="panel"><h2>Календарь</h2>${calendarHTML()}</div>
<div class="panel"><h2>Доход за 14 дней</h2><div class="chart">${chart}</div></div>
<div class="panel"><h2>⚔️ Дуэль с прошлой неделей</h2>
<div class="small">Эта неделя: <b>${fmt(cur)}</b> · Прошлая: <b>${fmt(last)}</b> · Побед: <b>${S.duelWins}</b></div>
<div style="margin:10px 0 4px" class="small">Ты сейчас</div><div class="bar"><div class="fill good" style="width:${Math.round(cur/duelMax*100)}%"></div></div>
<div style="margin:8px 0 4px" class="small">Прошлая неделя</div><div class="bar"><div class="fill bad" style="width:${Math.round(last/duelMax*100)}%"></div></div>
<div class="small" style="margin-top:8px">Обгони прошлую себя к концу недели → +1000 монет.</div></div>
<div class="panel"><h2>Дисциплина</h2><div class="small">Ранг: <b>${rank.icon} ${rank.name}</b> · ${S.disc}/100</div>
<div style="margin:10px 0" class="bar big"><div class="fill ${dc}" style="width:${S.disc}%"></div></div>
<div class="small">🥉 0–49 · 🥈 50–74 · 🥇 75–99 · 💎 100</div>
<div style="margin-top:12px" class="notice">Пропусков: <b>${S.missed}</b> · Штрафов: <b>${S.fines}</b> · Щитом: <b>${S.shielded}</b> · Сумма: <b>${fmt(S.fineTotal)}</b></div></div>
<div class="panel"><h2>🧠 Ветки навыков</h2><div class="stats profile-stats">${skills}</div>
<div class="small" style="margin-top:10px">Каждый квест качает свою ветку. Держи баланс — получи достижение «Гармония».</div></div>
<div class="panel"><h2>Статистика за 14 дней</h2><div class="stats profile-stats">
<div class="stat"><b>${fmt(tot)}</b><span>Всего</span></div><div class="stat"><b>${fmt(avg)}</b><span>Среднее/активный день</span></div>
<div class="stat"><b>${fmt(best.e)}</b><span>Лучший день</span></div><div class="stat"><b>${act}</b><span>Активных дней</span></div></div></div>`}
function profileTab(){const stats=[["Баланс","🪙 "+fmt(S.coins)],["Заработано",fmt(S.earned)],["Потрачено",fmt(S.spent)],["Квестов",fmt(S.q)],["Покупок",fmt(S.purchases)],["Серия",fmt(S.s)],["Активных дней",fmt(S.ad.length)],["Начало",S.created]];

const avgSleep=(()=>{const last7=S.sleepLog.slice(-7);if(!last7.length)return 0;return Math.round(last7.reduce((s,e)=>s+e.h,0)/last7.length*10)/10})();
return `<div class="panel profile"><div class="avatar-large">${S.profile.avatar?`<img src="${esc(S.profile.avatar)}">`:"🧙‍️"}</div>

<div class="form" style="margin-top:10px"><input id="sleepH" type="number" step="0.5" min="0" max="24" placeholder="Часы сна (7-9 = бонус)">

<div class="panel"><button class="danger" data-action="reset">Сбросить весь прогресс</button></div>`}
