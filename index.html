<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Life Quest Ultimate Premium</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
--text:#f4f6ff;--muted:rgba(244,246,255,.62);
--line:rgba(255,255,255,.10);--line2:rgba(255,255,255,.18);
--card:rgba(255,255,255,.055);--media:rgba(255,255,255,.06);--input:rgba(255,255,255,.075);
--gold:#f5c56b;--gold2:#ffe9b0;--violet:#8b5cf6;--cyan:#22d3ee;--good:#34d399;--danger:#fb7185;
--grad:linear-gradient(135deg,#f5c56b,#ff8a5c 30%,#8b5cf6 65%,#22d3ee);
--numgrad:linear-gradient(90deg,#ffe9b0,#22d3ee);
--ringbg:#0b1024;
--shadow:0 24px 80px rgba(0,0,0,.45);
}
:root[data-theme="light"]{
--text:#131730;--muted:rgba(19,23,48,.62);
--line:rgba(19,23,48,.12);--line2:rgba(19,23,48,.22);
--card:rgba(255,255,255,.72);--media:rgba(19,23,48,.05);--input:rgba(19,23,48,.05);
--numgrad:linear-gradient(90deg,#7c3aed,#0e7490);
--ringbg:#fff;
--shadow:0 20px 60px rgba(19,23,48,.12);
}
*{box-sizing:border-box}
body{margin:0;font-family:Manrope,Arial,sans-serif;color:var(--text);background:linear-gradient(160deg,#05070f,#0b1024 55%,#0a0f1e);min-height:100vh;overflow-x:hidden}
:root[data-theme="light"] body{background:linear-gradient(160deg,#f7f8ff,#eef2fb 60%,#f3f0ff)}
body::before,body::after{content:"";position:fixed;z-index:-1;border-radius:50%;filter:blur(90px);opacity:.45;pointer-events:none;animation:aurora 20s ease-in-out infinite alternate}
body::before{width:65vmax;height:65vmax;left:-25vmax;top:-25vmax;background:radial-gradient(circle,#6d28d9,transparent 62%)}
body::after{width:55vmax;height:55vmax;right:-20vmax;bottom:-20vmax;background:radial-gradient(circle,#0e7490,transparent 62%);animation-delay:-10s}
:root[data-theme="light"] body::before{background:radial-gradient(circle,rgba(139,92,246,.30),transparent 62%)}
:root[data-theme="light"] body::after{background:radial-gradient(circle,rgba(34,211,238,.25),transparent 62%)}
@keyframes aurora{from{transform:translate(0,0) scale(1)}to{transform:translate(5vmax,3vmax) scale(1.12)}}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:linear-gradient(#8b5cf6,#22d3ee);border-radius:99px}
::-webkit-scrollbar-track{background:transparent}
button,input,textarea,select{font:inherit}
#app{padding:18px 16px 48px}
.shell{max-width:1040px;margin:0 auto;display:grid;gap:16px}
.panel{position:relative;background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.035));border:1px solid var(--line);border-radius:28px;backdrop-filter:blur(22px);box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.08);padding:18px}
:root[data-theme="light"] .panel{background:linear-gradient(180deg,rgba(255,255,255,.85),rgba(255,255,255,.65))}
.hero{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:22px;background:linear-gradient(135deg,rgba(139,92,246,.22),rgba(34,211,238,.10)),linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.035))}
.hero-left{display:flex;align-items:center;gap:16px;min-width:0}
.hero-right{display:flex;gap:8px}
.ring{width:88px;height:88px;border-radius:50%;padding:4px;background:conic-gradient(var(--gold) calc(var(--p)*1%),rgba(255,255,255,.14) 0);flex:0 0 auto;box-shadow:0 0 26px rgba(245,197,107,.28)}
.ring .avatar{width:100%;height:100%;border-radius:50%}
.avatar{width:74px;height:74px;border-radius:50%;overflow:hidden;display:grid;place-items:center;font-size:34px;background:var(--ringbg)}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.name{font-family:Unbounded,Manrope,sans-serif;margin:0;font-size:26px;font-weight:700;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;overflow-wrap:break-word}
.badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.badge{padding:7px 11px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid var(--line);font-weight:700;font-size:12px;color:var(--text);backdrop-filter:blur(8px)}
.badge.gold{background:linear-gradient(90deg,rgba(245,197,107,.22),rgba(34,211,238,.14));border-color:rgba(245,197,107,.42);color:var(--gold2)}
:root[data-theme="light"] .badge{background:rgba(255,255,255,.7)}
:root[data-theme="light"] .badge.gold{color:#8a6100}
.icon-btn{width:50px;height:50px;border-radius:17px;border:1px solid var(--line);background:rgba(255,255,255,.08);color:var(--text);font-size:22px;cursor:pointer;transition:.18s}
.icon-btn:hover{transform:translateY(-2px);border-color:var(--line2)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px;text-align:center;transition:.2s}
.stat:hover{transform:translateY(-3px);border-color:var(--line2)}
.stat b{display:block;font-size:20px;line-height:1.2;background:var(--numgrad);-webkit-background-clip:text;background-clip:text;color:transparent}
.stat span{display:block;margin-top:6px;color:var(--muted);font-size:12px}
.super{display:grid;grid-template-columns:150px 1fr;gap:16px;align-items:center;border-color:rgba(245,197,107,.34);background:linear-gradient(135deg,rgba(245,197,107,.12),rgba(34,211,238,.08)),linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.035));animation:glowPulse 4s ease-in-out infinite}
.super.done{border-color:rgba(52,211,153,.4)}
.super.boss{border-color:rgba(251,113,133,.35);background:linear-gradient(135deg,rgba(251,113,133,.12),rgba(139,92,246,.10)),linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.035))}
@keyframes glowPulse{0%,100%{box-shadow:var(--shadow)}50%{box-shadow:var(--shadow),0 0 44px rgba(245,197,107,.16)}}
.super-media .media{height:112px;border-radius:22px}
.small{color:var(--muted);font-size:13px;line-height:1.45}
.gold{color:var(--gold)}
h1,h2,h3{margin:0}
h2{font-family:Unbounded,Manrope,sans-serif;font-size:19px;margin:0 0 12px;position:relative;padding-bottom:10px}
h2::after{content:"";position:absolute;left:0;bottom:0;width:52px;height:3px;border-radius:99px;background:var(--grad)}
.bar{height:12px;border-radius:999px;overflow:hidden;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.07)}
.bar.big{height:16px}
.fill{position:relative;height:100%;width:0%;background:linear-gradient(90deg,var(--violet),var(--cyan));transition:width .35s ease;overflow:hidden}
.fill.gold{background:linear-gradient(90deg,var(--gold),#ff9f43)}
.fill.good{background:linear-gradient(90deg,var(--good),var(--cyan))}
.fill.bad{background:linear-gradient(90deg,var(--danger),#f97316)}
.fill::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);transform:translateX(-100%);animation:shimmer 2.4s infinite}
@keyframes shimmer{to{transform:translateX(100%)}}
.super-actions{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px}
.tabs{display:flex;gap:8px;padding:8px;overflow:auto;background:rgba(255,255,255,.04);border-radius:22px}
.tab{flex:1;min-width:96px;padding:12px 10px;border-radius:16px;border:1px solid transparent;background:transparent;color:var(--text);font-weight:800;cursor:pointer;transition:.18s}
.tab.active{background:linear-gradient(135deg,var(--violet),var(--cyan));border-color:transparent;color:#fff;box-shadow:0 8px 26px rgba(139,92,246,.38)}
:root[data-theme="light"] .tab{color:#131730}
:root[data-theme="light"] .tab.active{color:#fff}
.content{display:grid;gap:16px}
.form{display:grid;gap:10px}
input,textarea,select{width:100%;min-height:50px;padding:12px 14px;color:var(--text);background:var(--input);border:1px solid var(--line);border-radius:16px;outline:none;transition:.15s}
textarea{min-height:92px;resize:vertical}
input::placeholder,textarea::placeholder{color:rgba(255,255,255,.40)}
:root[data-theme="light"] input::placeholder,:root[data-theme="light"] textarea::placeholder{color:rgba(19,23,48,.40)}
input:focus,textarea:focus,select:focus{border-color:rgba(34,211,238,.65);box-shadow:0 0 0 3px rgba(34,211,238,.12)}
button{position:relative;overflow:hidden;border:0;min-height:50px;padding:12px 16px;border-radius:16px;color:#fff;font-weight:800;cursor:pointer;background:linear-gradient(90deg,var(--violet),var(--cyan));box-shadow:0 12px 26px rgba(139,92,246,.25);transition:.18s}
button:not(:disabled)::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);transform:skewX(-20deg);transition:left .5s}
button:not(:disabled):hover::after{left:120%}
button:hover:not(:disabled){transform:translateY(-2px)}
button:disabled{opacity:.45;cursor:default}
button.danger{background:linear-gradient(90deg,var(--danger),#f97316)}
button.dim{opacity:.55}
button.mini{min-height:42px;padding:8px 12px;border-radius:13px}
.hint{margin-top:10px;color:var(--muted);font-size:13px;line-height:1.45}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:12px;display:grid;gap:10px;transition:.2s}
.card:hover{transform:translateY(-4px);border-color:var(--line2);box-shadow:0 16px 40px rgba(0,0,0,.25)}
.card.done{opacity:.55}
.card.r-rare{border-color:rgba(34,211,238,.35);box-shadow:0 0 24px rgba(34,211,238,.10)}
.card.r-epic{border-color:rgba(139,92,246,.40);box-shadow:0 0 26px rgba(139,92,246,.14)}
.card.r-legendary{border-color:rgba(245,197,107,.45);box-shadow:0 0 30px rgba(245,197,107,.16)}
.card.super-item{border-color:rgba(245,197,107,.45)}
.media{height:88px;border-radius:17px;overflow:hidden;display:grid;place-items:center;background:var(--media);border:1px solid var(--line)}
.media img{width:100%;height:100%;object-fit:cover;display:block}
.ico{font-size:40px}
.pet-float{animation:floaty 3s ease-in-out infinite}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.card-body{display:grid;gap:6px}
.card-actions{display:flex;gap:8px}
.card-actions button:first-child{flex:1}
.price{color:var(--gold);font-weight:800}
.rarity{width:max-content;padding:5px 9px;border-radius:999px;font-size:11px;font-weight:900}
.rarity.common{background:rgba(255,255,255,.10)}
.rarity.rare{background:rgba(34,211,238,.16);color:#a5f3fc;border:1px solid rgba(34,211,238,.25)}
.rarity.epic{background:rgba(139,92,246,.18);color:#ddd6fe;border:1px solid rgba(139,92,246,.28)}
.rarity.legendary{background:rgba(245,197,107,.14);color:#fde68a;border:1px solid rgba(245,197,107,.28)}
.achgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.ach{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px;opacity:.42;filter:grayscale(.55);display:grid;gap:7px}
.ach.un{opacity:1;filter:none;border-color:rgba(34,211,238,.38);background:linear-gradient(135deg,rgba(139,92,246,.16),rgba(34,211,238,.08));box-shadow:0 0 22px rgba(34,211,238,.10)}
.ai{font-size:30px}
.profile{display:grid;gap:14px;justify-items:start}
.avatar-large{width:120px;height:120px;border-radius:34px;overflow:hidden;display:grid;place-items:center;font-size:56px;background:var(--media);border:1px solid var(--line);box-shadow:0 0 34px rgba(139,92,246,.18)}
.avatar-large img{width:100%;height:100%;object-fit:cover;display:block}
.file-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:12px 16px;border-radius:16px;background:rgba(255,255,255,.09);border:1px dashed var(--line2);cursor:pointer;font-weight:800;color:var(--text)}
.profile-stats{grid-template-columns:repeat(2,1fr);width:100%}
.empty{padding:14px;color:var(--muted);border:1px dashed var(--line2);border-radius:16px}
.prev{width:72px;height:72px;object-fit:cover;border-radius:16px;border:1px solid var(--line2);box-shadow:0 8px 24px rgba(0,0,0,.25)}
.prev.big{width:100%;height:140px}
.chart{display:flex;align-items:flex-end;gap:6px;height:170px;padding:12px 0 4px}
.col{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px}
.bar-v{width:100%;min-height:3px;border-radius:8px 8px 0 0;background:linear-gradient(180deg,var(--cyan),var(--violet));box-shadow:0 0 18px rgba(34,211,238,.12)}
.col span{font-size:10px;color:var(--muted)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal-cell{aspect-ratio:1;border-radius:12px;display:grid;place-items:center;font-size:12px;font-weight:700;background:var(--media);border:1px solid var(--line)}
.cal-cell.ok{background:rgba(52,211,153,.25);border-color:rgba(52,211,153,.4)}
.cal-cell.part{background:rgba(245,197,107,.18);border-color:rgba(245,197,107,.35)}
.cal-cell.miss{background:rgba(251,113,133,.18);border-color:rgba(251,113,133,.35)}
.cal-cell.rest{background:rgba(34,211,238,.20);border-color:rgba(34,211,238,.4)}
.cal-cell.future{opacity:.35}
.cal-cell.today{outline:2px solid var(--cyan)}
.cal-cell.blank{background:transparent;border:none}
.notice{padding:12px;border-radius:16px;background:rgba(251,113,133,.08);border:1px solid rgba(251,113,133,.18);color:var(--muted)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#toasts{position:fixed;right:14px;bottom:14px;display:grid;gap:9px;z-index:999;max-width:min(420px,calc(100vw - 28px))}
.toast{padding:14px 16px;border-radius:18px;background:rgba(10,14,28,.92);border:1px solid var(--line2);border-left:4px solid var(--cyan);backdrop-filter:blur(14px);box-shadow:var(--shadow);animation:tIn .3s ease;font-weight:700;line-height:1.35;color:#fff}
:root[data-theme="light"] .toast{background:rgba(255,255,255,.95);color:#131730}
.toast.success{border-left-color:var(--good)}
.toast.error{border-left-color:var(--danger)}
@keyframes tIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media(max-width:760px){.stats{grid-template-columns:repeat(2,1fr)}.super{grid-template-columns:1fr}.tabs{display:grid;grid-template-columns:repeat(2,1fr)}.tab{min-width:0}.row2{grid-template-columns:1fr}.name{font-size:22px}}
</style>
</head>
